[build-system]
requires = ["maturin>=1.12.5,<2"]
build-backend = "maturin"

[project]
name = "risearch"
dynamic = ["version", "license"]
requires-python = ">=3.11"
description = "Fast RNA and DNA interaction search, returning Polars DataFrames"
readme = "README.md"
authors = [{ name = "Stefano Roncelli", email = "stefano.roncelli@sund.ku.dk" }]
keywords = ["RNA", "DNA", "bioinformatics", "RNA-RNA interaction", "sequence-search", "suffix-array"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = ["polars>=1.43.2"]

[project.urls]
Homepage = "https://github.com/saiden89/risearch"
Documentation = "https://saiden89.github.io/risearch/"
Repository = "https://github.com/saiden89/risearch"
Issues = "https://github.com/saiden89/risearch/issues"
Changelog = "https://github.com/saiden89/risearch/blob/main/CHANGELOG.md"

[project.optional-dependencies]
lts-cpu = ["polars[rtcompat]"]

[dependency-groups]
dev = ["pytest", "maturin", "ruff", "ty", "pyrefly"]
docs = ["zensical", "mkdocstrings-python"]

[tool.uv]
package = false

[tool.maturin]
python-source = "."
module-name = "risearch._native"
locked = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["risearch"]

[tool.ty.src]
include = ["risearch"]

[tool.pyrefly]
search-path = ["."]

[tool.cibuildwheel.macos]
environment = { LZMA_API_STATIC = "1" }

[tool.cibuildwheel]
build-frontend = "build[uv]"
config-settings = { build-args = "--generate-stubs" }
build = ["cp*-manylinux_*", "cp*-macosx_arm64"]
skip = "cp*t-*"
test-skip = "cp315-*"  # polars 1.44 Series methods return None on 3.15rc: pola-rs/polars#29419
test-requires = ["pytest"]
test-command = "pytest {package}/tests/test_bindings.py -k 'not cli' -q --import-mode=importlib"

[tool.cibuildwheel.linux]
before-all = "sh {project}/.github/scripts/install-rustup.sh"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
