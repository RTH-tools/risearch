[package]
name = "risearch-python"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition.workspace = true
publish = false
description = "Python extension module for RIsearch"
repository = "https://github.com/saiden89/risearch"
include = [
    "/src/**",
    "/risearch/*.py",
    "/risearch/*.pyi",
    "/risearch/py.typed",
    "/pyproject.toml",
    "/README.md",
]

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false

[dependencies]
risearch = { path = "../..", default-features = false }
rayon = "1.5"
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
arrow-array = { version = "59.1.0", features = ["ffi"] }
arrow-schema = "59.1.0"
pyo3-log = "0.13.4"
