[workspace]
members = [".", "bindings/python"]
resolver = "3"

[workspace.package]
version = "3.0.0-alpha.3"
rust-version = "1.88"
edition = "2021"
license = "BUSL-1.1"

[package]
name = "risearch"
version.workspace = true
rust-version.workspace = true

edition.workspace = true
description = "Fast RNA-RNA interaction search using suffix arrays and thermodynamic scoring"
repository = "https://github.com/saiden89/risearch"
license.workspace = true
keywords = ["rna", "bioinformatics", "suffix-array", "alignment", "genomics"]
categories = ["science::bioinformatics", "command-line-utilities", "algorithms"]
include = [
  "/src/**",
  "/benches/**",
  "/build.rs",
  "/README.md",
  "/LICENSE",
  "/CITATION.cff",
]

[features]
default = ["cli", "mimalloc"]
cli = ["dep:anyhow", "dep:clap", "dep:env_logger"]
prof = []
openmp = ["libsais/openmp"]

[dependencies]
anyhow = { version = "1.0.47", optional = true }
clap = { version = "4.0.0", default-features = false, features = [
  "std",
  "help",
  "usage",
  "derive",
], optional = true }
env_logger = { version = "0.11.0", features = ["color"], optional = true }
flate2 = { version = "1.0.30", default-features = false, features = ["zlib"] }
fs-err = "3.0.0"
itoa = "1.0.0"
libsais = { version = "0.2.0", default-features = false }
log = { version = "0.4.8", features = ["release_max_level_info"] }
memmap2 = "0.9.0"
mimalloc = { version = "0.1.18", optional = true }
needletail = "0.7.0"
rayon = "1.0.3"
rkyv = { version = "0.8.0", features = ["bytecheck", "std", "pointer_width_64"] }
thiserror = "2.0.0"
zstd = "0.13.2"

[dev-dependencies]
approx = "0.5.1"
assert_cmd = "2.2.2"
criterion = { version = "0.8.2", features = ["html_reports"] }
predicates = "3.1.4"
pretty_assertions = "1.4.1"
proptest = "1.11"
rstest = "0.27.0"
tempfile = "3.27.0"

[[bin]]
name = "risearch"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "format"
harness = false

[[bench]]
name = "dp"
harness = false

[[bench]]
name = "search"
harness = false
required-features = ["mimalloc"]

[[bench]]
name = "seed"
harness = false

[profile.test]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = 2
lto = false
split-debuginfo = "packed"

[profile.release]
debug = false
lto = "fat"
codegen-units = 1

[profile.mutants]
inherits = "test"
debug = "none"


[lints.rust]
unreachable_pub = "warn"
missing_docs = "warn"
