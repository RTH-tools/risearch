[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
include-dev = true
include-build = true
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "bzip2-1.0.6",
]

# Keep the project's license scoped to its own crates.
[[licenses.exceptions]]
name = "risearch"
allow = ["BUSL-1.1"]

[bans]
multiple-versions = "warn"

[[bans.skip]]
name = "syn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
