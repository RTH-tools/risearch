name: Python distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: "Linux" }
          - { os: macos-latest,  label: "macOS" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"

      - name: Setup Rust
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-rust

      - name: Build and test wheels
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        with:
          package-dir: bindings/python

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.label }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build sdist
        working-directory: bindings/python
        run: uv run --locked maturin sdist -o dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
