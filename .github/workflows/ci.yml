name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-deny
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked --workspace check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

      - name: Setup Rust
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets --features prof -- -D warnings

      - name: docs
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p risearch --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88.0"

      - name: cargo check on MSRV
        run: cargo check --locked --workspace --all-targets --all-features

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-minimal-versions
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-hack,cargo-minimal-versions

      # No --locked: the tool regenerates the lock down to the declared minimums.
      # --ignore-private: pyo3-log's floor in the unpublished binding crate would otherwise override this crate's own.
      - name: Check direct-minimal-versions
        run: cargo minimal-versions check --direct --no-dev-deps --ignore-private -p risearch

  semver:
    name: API stability
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'semver-breaking')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # --baseline-rev resolves the base commit out of the local .git.
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-semver-checks


      - name: Check for breaking API changes
        env:
          BASELINE_REV: ${{ github.event.pull_request.base.sha }}
        run: |
          cargo semver-checks \
            --package risearch \
            --baseline-rev "$BASELINE_REV" \
            --release-type minor \
            --default-features \
            --verbose

  test:
    name: Test ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: ubuntu }
          - { os: macos-latest, label: macOS }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: nextest

      - name: Run tests
        run: cargo nextest run --locked --workspace

      - name: Run doctests
        run: cargo test --locked --workspace --doc

      - name: Run release tests
        run: cargo nextest run --locked --release --workspace

      - name: Run OpenMP tests
        if: runner.os == 'Linux'
        env:
          OMP_NUM_THREADS: "2"
        run: cargo nextest run --locked -p risearch --features openmp -E 'test(/^index::store::/)'

  test-python:
    name: Python suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"

      - name: Sync Python environment
        working-directory: bindings/python
        run: uv sync --locked --python 3.10

      - name: ruff check
        working-directory: bindings/python
        run: uv run --locked ruff check .

      - name: ruff format
        working-directory: bindings/python
        run: uv run --locked ruff format --check .

      - name: ty
        working-directory: bindings/python
        run: uv run --locked ty check .

      - name: pyrefly
        working-directory: bindings/python
        run: uv run --locked pyrefly check .

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build CLI for Python cross-checks
        run: cargo build --locked --bin risearch

      # uv sync already ran above; maturin develop adds the native extension.
      - name: Build extension into the locked environment
        working-directory: bindings/python
        run: uv run --locked maturin develop

      - name: Run Python suite
        working-directory: bindings/python
        run: uv run --locked pytest -q

      - name: Verify sdist roundtrip
        working-directory: bindings/python
        run: uv run --locked maturin build --sdist -o "${{ runner.temp }}/sdist-check"

  packaging:
    name: Packaging ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: "Linux" }
          - { os: macos-latest,  label: "macOS" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"

      - name: Setup Rust
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-rust

      - name: Build and test wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: bindings/python
